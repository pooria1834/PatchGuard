[project]
name = "patchguard-safelab"
version = "0.1.0"
description = "Dynamic patch validation and regression testing"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8.0,<10"]

[tool.setuptools.packages.find]
include = ["patchguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=artifacts/pytest-tmp"
markers = ["integration: requires the container toolchain"]
